name: probe
on:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p out
          echo "artifact-content-test" > out/test.txt
      - uses: actions/upload-artifact@v4
        with:
          name: probe-artifact
          path: out/
