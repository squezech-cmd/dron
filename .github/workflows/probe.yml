name: probe

on:
  push:
    branches: ['arena/**']
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build current sources
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon -q > /tmp/build.txt 2>&1 || tail -40 /tmp/build.txt

      - name: Inspect
        run: bash .github/probe.sh > /tmp/probe.txt 2>&1 || true

      - name: Trim report
        run: |
          wc -c /tmp/probe.txt
          head -c 200000 /tmp/probe.txt > /tmp/probe2.txt && mv /tmp/probe2.txt /tmp/probe.txt

      - name: Publish report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          {
            echo '```'
            head -c 63000 /tmp/probe.txt || true
            echo '```'
          } > /tmp/issue.md
          gh issue create --repo "$REPO" --title "probe report ${GITHUB_SHA:0:7}" --body-file /tmp/issue.md
