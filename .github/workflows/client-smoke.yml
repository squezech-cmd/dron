name: Client smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  client:
    name: Headless client boots into a world
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install virtual display and GL libraries
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            xvfb libgl1-mesa-dri mesa-utils libglu1-mesa \
            libxi6 libxcursor1 libxrandr2 libxinerama1 libxxf86vm1 \
            libopenal1 libpulse0 || true

      - name: Prepare run directory
        run: |
          chmod +x ./gradlew
          mkdir -p run/config
          printf '%s\n' \
            'eula=true' > run/eula.txt
          # Ask Loom to run the client in a virtual framebuffer.
          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx2G' >> gradle.properties
          echo "chmod done"

      - name: Boot client (headless)
        timeout-minutes: 15
        run: |
          set +e
          export LIBGL_ALWAYS_SOFTWARE=1
          export MESA_GL_VERSION_OVERRIDE=3.3
          ( sleep 220; echo "stop" ) | \
          timeout 320 xvfb-run -a -s "-screen 0 1280x720x24" \
            ./gradlew runClient --no-daemon --console=plain > /tmp/client.log 2>&1
          echo "gradle exit=$?"
          tail -n 40 /tmp/client.log

      - name: Assert client booted
        run: |
          set -euo pipefail
          grep -E "Dron client initialised|Setting user|OpenAL initialized|Backend library: LWJGL" /tmp/client.log || true
          if grep -qE "Mixin apply for mod dron failed|Failed to start|java.lang.RuntimeException|Exception in thread \"main\"|Crash report" /tmp/client.log; then
            echo "::error::the client crashed while loading the mod"
            grep -nE "Mixin apply|Caused by|Exception|at com.squezech" /tmp/client.log | head -n 60
            exit 1
          fi
          if ! grep -q "Dron client initialised" /tmp/client.log; then
            echo "::error::client never initialised the dron mod"
            tail -n 80 /tmp/client.log
            exit 1
          fi
          echo "client initialised the mod cleanly"

      - name: Upload client log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-log
          path: /tmp/client.log
