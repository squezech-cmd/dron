name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build mod jar
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle.properties', 'build.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon --console=plain

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: dron-mod
          path: |
            build/libs/dron-*.jar
            !build/libs/*sources*.jar
          if-no-files-found: error

      - name: Attach jar to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          JAR="$(ls build/libs/dron-*.jar | grep -v sources | head -n1)"
          gh release create "${GITHUB_REF_NAME}" "$JAR" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Dron ${GITHUB_REF_NAME#v}" \
            --notes "Боевой FPV-дрон для Minecraft 1.20.1 (Fabric).

          Установка: Fabric Loader для 1.20.1 + Fabric API, положить \`$(basename "$JAR")\` в папку \`mods\`." \
            || gh release upload "${GITHUB_REF_NAME}" "$JAR" --repo "$GITHUB_REPOSITORY" --clobber
