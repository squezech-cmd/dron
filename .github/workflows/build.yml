name: Build Mod

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build mod jar
        run: ./gradlew build --stacktrace

      - name: Upload mod jar as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dron-mod
          path: build/libs/dron-*.jar
          if-no-files-found: error
